<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Test</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="card">
    <section id="upload-view">
      <input type="file" id="image-upload" accept="image/*" hidden />
      
      <label for="image-upload" class="dropzone" id="dropzone">
        <div class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <img id="preview" alt="Preview" class="hidden" />
      </label>

      <textarea id="user-prompt" placeholder="Type a message or question..." rows="3"></textarea>

      <button id="send-btn" disabled>Send</button>
    </section>

    <section id="loading-view" class="hidden">
      <div class="spinner"></div>
      <p id="loading-status">Sending image...</p>
    </section>

    <section id="result-view" class="hidden">
      <div id="result-content"></div>
      <button id="go-back-btn" class="action-btn">Go Back</button>
    </section>
  </main>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="systemhandler.js"></script>
</body>
</html>
